name: Deploy to GitHub Pages

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Brood War sprites are downloaded at deploy time and served with the site; the repo holds none.
      - run: node scripts/fetch-bw.mjs dist
        env:
          NODE_ENV: production
          BW_ZIP_URL: ${{ vars.BW_ZIP_URL }}
      - run: node --experimental-strip-types scripts/check-bw.ts dist/bw
      # The WoW 1.12 interface (frames, buttons, action bar, icons, fonts) is converted at deploy time;
      # converted files are cached between runs so the client is only downloaded once.
      - uses: actions/cache@v4
        with:
          path: .wow-cache
          key: wow-${{ hashFiles('scripts/fetch-wow.mjs', 'scripts/blp.mjs') }}
          restore-keys: wow-
      - run: sudo apt-get install -y innoextract
      - run: node scripts/fetch-wow.mjs dist
        env:
          WOW_ARCHIVE_URL: ${{ vars.WOW_ARCHIVE_URL }}
      - run: node scripts/probe-wow.mjs
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
