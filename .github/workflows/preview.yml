name: Brood War previews

# Branch-only visual checks: contact sheets of the Brood War data and in-game screenshots,
# printed into each job's log as base64 PNG/JPEG lines. Nothing is published.
on:
  push:
    branches: ['claude/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sheet: [terrain, doodads, neutral, fx, ui, screens]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - if: matrix.sheet != 'screens'
        run: node scripts/fetch-bw.mjs /tmp/bwout && node --experimental-strip-types scripts/bw-preview.ts bwprev ${{ matrix.sheet }}
        env:
          NODE_ENV: production
          BW_INVENTORY: '1'
      - if: matrix.sheet == 'screens'
        run: |
          npm run build
          node scripts/fetch-bw.mjs dist
          npm i --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          (npx vite preview --port 4173 --strictPort &) && sleep 3
          node scripts/ci-screens.cjs
        env:
          NODE_ENV: production
