# Temporary: iterate on the WoW interface extraction without waiting for the Brood War step.
name: WoW probe
on:
  push:
    branches: ['claude/project-thread-k2dpai']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get install -y innoextract
      - uses: actions/cache@v4
        with:
          path: .wow-cache
          key: wow-${{ hashFiles('scripts/fetch-wow.mjs', 'scripts/blp.mjs') }}
          restore-keys: wow-
      - run: node scripts/fetch-wow.mjs dist
        env:
          WOW_LIST: '1'
      - run: du -sh dist/wow; ls dist/wow; ls dist/wow/interface | head -80
