# Temporary: measure archive.org download speeds for the WoW client sources.
name: WoW speed
on:
  push:
    branches: ['claude/project-thread-k2dpai']
    paths: ['.github/workflows/wow-speed.yml']
jobs:
  speed:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in \
            "https://archive.org/download/nostalrius-wow-classic/Nostalrius-WoW-Classic.zip/WoW%20Classic%2FWoW-1.12.1-Setup-1.bin" \
            "https://archive.org/download/nostalrius-wow-classic/Nostalrius-WoW-Classic.zip" \
            "https://archive.org/download/World_of_Warcraft_Client_and_Installation_Archive/ISO/WoW-1.12.1_install.rar" \
            "https://archive.org/download/wow-1.12.1-deutsch/Vorinstalliert%20v1.12.1%20deutsch.7z"; do
            curl -sL -o /dev/null --max-time 45 -w "%{http_code} %{size_download} bytes %{speed_download} B/s $u\n" "$u" || true
          done
